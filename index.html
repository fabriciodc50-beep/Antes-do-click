<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Antes do Primeiro Clique · Lumiar Retratos</title>
<meta name="description" content="Como funciona a Experiência Lumiar, antes da câmera entrar em cena.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Poppins:wght@200;300;400;500&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#FAF9F6; --card:#FFFFFF; --ink:#161513; --soft:#5A574F;
  --gold:#8a6d3f; --gilt:#C7A96B; --line:#E2DED4; --mute:#8A867D; --wash:#F4F1E9;
  --serif:'Cormorant Garamond',Georgia,serif;
  --sans:'Poppins',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;background:var(--paper);color:var(--ink);
  font-family:var(--sans);font-weight:300;font-size:15px;line-height:1.75;
  -webkit-font-smoothing:antialiased;
}
img{max-width:100%;display:block}

/* ---------- topo ---------- */
#top{
  position:sticky;top:0;z-index:40;background:rgba(250,249,246,.94);
  backdrop-filter:blur(10px);border-bottom:1px solid var(--line);
}
#top .bar{max-width:720px;margin:0 auto;padding:13px 22px;display:flex;align-items:center;justify-content:space-between;gap:14px}
#top .mark{font-family:var(--serif);font-size:17px;letter-spacing:.06em}
#top .mark small{display:block;font-family:var(--sans);font-size:7.5px;letter-spacing:.3em;text-transform:uppercase;color:var(--gold);margin-top:-2px}
#top .nicho{font-size:9px;letter-spacing:.2em;text-transform:uppercase;color:var(--mute);text-align:right}
#prog{height:2px;background:var(--gilt);width:0%;transition:width .15s linear}

/* ---------- estrutura ---------- */
.wrap{max-width:720px;margin:0 auto;padding:0 22px}
section{padding:52px 0;border-bottom:1px solid var(--line);scroll-margin-top:58px}
section:last-of-type{border-bottom:0}
.eyebrow{font-size:8.5px;letter-spacing:.26em;text-transform:uppercase;color:var(--gold);margin:0 0 10px}
h2{font-family:var(--serif);font-weight:500;font-size:29px;line-height:1.12;margin:0 0 10px;letter-spacing:.005em}
h3{font-family:var(--serif);font-weight:500;font-size:20px;margin:26px 0 6px}
p{margin:0 0 15px}
.lead{font-size:16.5px;color:var(--ink)}
em.kick{font-family:var(--serif);font-style:italic;font-size:19px;color:var(--soft);display:block;margin:0 0 22px}
strong{font-weight:500}
ul{margin:0 0 15px;padding-left:19px}
li{margin-bottom:7px}

/* ---------- capa ---------- */
#capa{padding:0 0 46px;border-bottom:1px solid var(--line)}
.hero{position:relative;background:var(--wash);aspect-ratio:4/5;max-height:70vh;overflow:hidden}
.hero img{width:100%;height:100%;object-fit:cover}
.hero .veil{position:absolute;inset:0;background:linear-gradient(180deg,rgba(22,21,19,0) 38%,rgba(22,21,19,.72) 100%)}
.hero .tt{position:absolute;left:0;right:0;bottom:0;padding:26px 22px}
.hero .tt .ey{font-size:8.5px;letter-spacing:.26em;text-transform:uppercase;color:var(--gilt);margin-bottom:7px}
.hero h1{font-family:var(--serif);font-weight:500;font-size:38px;line-height:1.04;color:#FAF9F6;margin:0}
.hero .sub{font-family:var(--serif);font-style:italic;font-size:19px;color:#E4DFD3;margin-top:6px}
.hero.vazia .veil{background:linear-gradient(180deg,rgba(22,21,19,.15) 0%,rgba(22,21,19,.78) 100%)}
#capa .abaixo{padding:26px 22px 0;max-width:720px;margin:0 auto}
#capa .abaixo p{font-size:16.5px}

/* ---------- blocos ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:13px;padding:19px 20px;margin-bottom:11px}
.card h4{font-family:var(--serif);font-weight:500;font-size:18px;margin:0 0 4px}
.card p{margin:0;font-size:14px;color:var(--soft)}

.quote{
  font-family:var(--serif);font-size:22px;line-height:1.42;color:var(--ink);
  border-left:2px solid var(--gilt);padding:4px 0 4px 20px;margin:26px 0;
}
.selo{background:var(--wash);border-radius:13px;padding:20px;margin:22px 0}
.selo .t{font-size:9px;letter-spacing:.2em;text-transform:uppercase;color:var(--gold);margin-bottom:7px}
.selo p{margin:0;font-size:14px;color:var(--soft)}

.passos{counter-reset:p}
.passo{display:grid;grid-template-columns:30px 1fr;gap:15px;padding:15px 0;border-bottom:1px solid var(--line)}
.passo:last-child{border-bottom:0}
.passo .n{font-family:var(--serif);font-size:20px;color:var(--gilt);line-height:1.3}
.passo .t{font-size:15px;font-weight:400;margin-bottom:2px}
.passo .d{font-size:13.5px;color:var(--soft);line-height:1.6}

.lista-sim li::marker,.lista-nao li::marker{color:var(--gilt)}
.lista-nao{color:var(--soft)}

/* ---------- galeria ---------- */
.gal{display:grid;gap:8px;margin:26px 0}
.gal.duo{grid-template-columns:1fr 1fr}
.gal.solo{grid-template-columns:1fr}
.gal figure{margin:0;background:var(--wash);overflow:hidden;aspect-ratio:3/4}
.gal.solo figure{aspect-ratio:3/2}
.gal img{width:100%;height:100%;object-fit:cover}
.gal:empty{display:none}

/* ---------- faq ---------- */
details{border-bottom:1px solid var(--line);padding:2px 0}
details summary{
  list-style:none;cursor:pointer;padding:15px 26px 15px 0;position:relative;
  font-size:14.5px;font-weight:400;
}
details summary::-webkit-details-marker{display:none}
details summary::after{
  content:'+';position:absolute;right:2px;top:13px;color:var(--gilt);
  font-family:var(--serif);font-size:21px;line-height:1;
}
details[open] summary::after{content:'–'}
details .a{padding:0 0 16px;font-size:14px;color:var(--soft);line-height:1.7}

/* ---------- fecho ---------- */
#fecho{background:var(--ink);color:#EDE8DE;border-bottom:0}
#fecho .wrap{padding-top:8px;padding-bottom:8px}
#fecho h2{color:#FAF9F6}
#fecho .eyebrow{color:var(--gilt)}
#fecho p{color:#BDB7AA}
.check{display:flex;gap:12px;align-items:flex-start;padding:14px 0;border-bottom:1px solid rgba(255,255,255,.09);cursor:pointer}
.check:last-of-type{border-bottom:0}
.check input{
  appearance:none;width:19px;height:19px;flex:0 0 19px;margin-top:2px;
  border:1px solid #6B665C;border-radius:5px;background:transparent;cursor:pointer;position:relative;
}
.check input:checked{background:var(--gilt);border-color:var(--gilt)}
.check input:checked::after{content:'';position:absolute;left:6px;top:2px;width:5px;height:10px;border:solid #161513;border-width:0 2px 2px 0;transform:rotate(43deg)}
.check input:focus-visible{outline:2px solid var(--gilt);outline-offset:2px}
.check span{font-size:14px;color:#DCD7CB}
.btn{
  display:block;width:100%;text-align:center;text-decoration:none;
  font-family:var(--sans);font-size:13px;font-weight:400;letter-spacing:.02em;
  border-radius:11px;padding:17px 18px;margin-top:16px;border:1px solid var(--gilt);
  background:var(--gilt);color:#161513;cursor:pointer;transition:opacity .2s;
}
.btn.ghost{background:transparent;color:var(--gilt)}
.btn[aria-disabled="true"]{opacity:.32;pointer-events:none}
.assinatura{text-align:center;padding:34px 22px 46px;background:var(--ink);color:#6B665C;font-size:11px;letter-spacing:.08em}
.assinatura .fr{font-family:var(--serif);font-style:italic;font-size:16px;color:#9A9488;margin-bottom:10px;letter-spacing:0}

/* ---------- seletor (sem nicho no link) ---------- */
#seletor{padding:44px 0}
.portas{display:flex;flex-wrap:wrap;gap:7px;margin-top:14px}
.portas a{
  font-size:12px;text-decoration:none;color:#3A382F;background:var(--card);
  border:1px solid var(--line);border-radius:999px;padding:8px 14px;
}
.portas a:hover{border-color:var(--gilt)}

.edite{background:#FFF8E6;border:1px dashed #D9C489;border-radius:10px;padding:13px 15px;font-size:12.5px;color:#6B5426;margin:16px 0}
.edite b{font-weight:500}

/* ---------- sumário flutuante ---------- */
#fab{
  position:fixed;right:18px;bottom:18px;z-index:60;
  width:52px;height:52px;border-radius:50%;border:1px solid var(--gilt);
  background:var(--ink);color:var(--gilt);cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 6px 22px rgba(22,21,19,.26);transition:transform .2s;
}
#fab:active{transform:scale(.94)}
#fab:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
#fab svg{width:21px;height:21px;stroke:currentColor;stroke-width:1.5;fill:none;stroke-linecap:round}

#veu{position:fixed;inset:0;z-index:58;background:rgba(22,21,19,.42);opacity:0;pointer-events:none;transition:opacity .26s}
#veu.on{opacity:1;pointer-events:auto}

#sumario{
  position:fixed;left:0;right:0;bottom:0;z-index:59;
  background:var(--paper);border-top:1px solid var(--line);
  border-radius:20px 20px 0 0;padding:8px 0 18px;
  max-height:76vh;overflow-y:auto;
  transform:translateY(102%);transition:transform .3s cubic-bezier(.22,1,.36,1);
  box-shadow:0 -10px 34px rgba(22,21,19,.14);
}
#sumario.on{transform:translateY(0)}
#sumario .puxador{width:38px;height:4px;border-radius:9px;background:var(--line);margin:6px auto 12px}
#sumario .tit{font-size:8.5px;letter-spacing:.24em;text-transform:uppercase;color:var(--gold);padding:0 24px 8px}
#sumario a{
  display:flex;align-items:baseline;gap:12px;text-decoration:none;color:var(--ink);
  padding:11px 24px;font-size:14px;border-top:1px solid var(--line);
}
#sumario a .num{font-family:var(--serif);font-size:13px;color:var(--mute);min-width:16px}
#sumario a.ativo{background:var(--wash)}
#sumario a.ativo .num{color:var(--gilt)}
#sumario .fim{padding:14px 24px 0}
#sumario .fim a{border:0;padding:0;font-size:12px;color:var(--gold)}

@media (max-width:430px){
  .hero h1{font-size:31px}
  h2{font-size:25px}
  .quote{font-size:19px}
}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{transition:none!important}}
</style>
</head>
<body>

<span id="top-topo"></span>
<header id="top">
  <div class="bar">
    <div class="mark">Lumiar<small>Retratos</small></div>
    <div class="nicho" id="rotulo"></div>
  </div>
  <div id="prog"></div>
</header>

<main id="doc"></main>

<div id="veu"></div>
<nav id="sumario" aria-label="Sumário">
  <div class="puxador"></div>
  <div class="tit">Ir para</div>
  <div id="sum-itens"></div>
</nav>
<button id="fab" aria-label="Abrir sumário" aria-expanded="false">
  <svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h10"/></svg>
</button>

<script>
/* ══════════════════════════════════════════════════════════════
   1. CONFIGURAÇÃO — é só aqui que você mexe
   ══════════════════════════════════════════════════════════════ */
const CONFIG = {
  PASTA_FOTOS: 'fotos',            // pasta raiz das imagens
  EXT: 'jpg',                      // extensão usada nas fotos
  MAX_FOTOS: 12,                   // tenta 01 até 12 em cada pasta

  LINK_CADASTRO: 'https://lumiarretratos.alboomcrm.com/form_lead/#/index',
  LINK_AGENDA:   '',               // cole aqui o link do Cal.com ou Calendly
  WHATSAPP:      '5517991278704',

  VERSAO: '2026.1'
};

/* ══════════════════════════════════════════════════════════════
   2. NÚCLEO LUMIAR — escrito uma vez, vale para os 20 nichos
   ══════════════════════════════════════════════════════════════ */
const NUCLEO = {

filosofia: `
<p class="lead">Uma fotografia começa muito antes do primeiro clique.</p>
<p>Ela começa numa conversa. No que você está vivendo agora. No motivo que fez você procurar um estúdio justamente neste momento da sua vida — e não em outro.</p>
<p>Vivemos em um mundo acelerado. As pessoas passam por fases, vencem batalhas, constroem famílias, criam empresas, transformam suas vidas — e muitas vezes não percebem a grandeza das próprias histórias.</p>
<div class="quote">Não fotografamos apenas rostos: fotografamos histórias.<br>Não produzimos apenas imagens: criamos experiências.<br>Não entregamos apenas arquivos: entregamos lembranças que permanecem.</div>
<p>A Lumiar existe porque pessoas importam. Histórias importam. Memórias importam. E aquilo que importa merece ser lembrado.</p>`,

quemsomos: `

<p>Nosso propósito é transformar histórias, momentos e identidades em retratos capazes de gerar emoção, autoestima, conexão e legado. Nossa promessa é mais simples ainda: toda pessoa que passa pela Lumiar deve sair se sentindo mais vista, mais valorizada e mais conectada com a própria história.</p>
<h3>O que sustenta cada decisão nossa</h3>
<div class="card"><h4>Excelência</h4><p>Cada detalhe importa — da montagem da luz ao acabamento do último arquivo.</p></div>
<div class="card"><h4>Humanização</h4><p>Pessoas vêm antes das fotografias. Ouvimos antes de fotografar.</p></div>
<div class="card"><h4>Intenção</h4><p>Toda imagem precisa ter propósito. Uma fotografia bonita não é suficiente: ela precisa cumprir uma função.</p></div>
<div class="card"><h4>Autenticidade</h4><p>Nenhuma fotografia deve parecer artificial ou distante de quem você é.</p></div>`,

autoridade: `
<p>Não somos um estúdio que fotografa muito. Somos um estúdio que fotografa com método — e que recusa o improviso como forma de trabalho.</p>
<p>Trabalhamos com agenda limitada por escolha. Cada trabalho aceito ocupa tempo de planejamento, de produção, de curadoria e de tratamento. É isso que nos permite entregar no padrão que prometemos, e é isso que nos impede de atender todo mundo.</p>

<div class="selo"><div class="t">O que isso significa para você</div><p>Você não está contratando horas de fotografia. Está contratando um processo que já foi percorrido centenas de vezes, com alguém que sabe exatamente o que fazer quando o dia não sai como o planejado.</p></div>`,

metodo: `
<p>O Método Lumiar é a razão de existir deste documento. Ele começa muito antes da câmera e segue depois da entrega.</p>
<div class="passos">
  <div class="passo"><span class="n">1</span><div><div class="t">Escuta</div><div class="d">Entendemos seu momento antes de propor qualquer coisa. Nenhuma proposta nasce antes da conversa.</div></div></div>
  <div class="passo"><span class="n">2</span><div><div class="t">Planejamento</div><div class="d">Cenário, cores, luz, roteiro e ritmo são definidos antes do dia. Nada é improvisado.</div></div></div>
  <div class="passo"><span class="n">3</span><div><div class="t">Direção</div><div class="d">Você não precisa saber posar. Conduzimos do início ao fim — é o nosso trabalho, não o seu.</div></div></div>
  <div class="passo"><span class="n">4</span><div><div class="t">Curadoria</div><div class="d">Só o que está à altura da sua história chega até você. Descartamos sem dó o que não está.</div></div></div>
  <div class="passo"><span class="n">5</span><div><div class="t">Tratamento</div><div class="d">Edição autoral dentro do nosso padrão artístico, com gerenciamento de cor do início ao fim.</div></div></div>
  <div class="passo"><span class="n">6</span><div><div class="t">Entrega</div><div class="d">Imagens em alta resolução e, quando contratados, produtos com padrão de laboratório.</div></div></div>
</div>
<h3>As perguntas que fazemos antes de cada clique</h3>
<p>Quem é essa pessoa? O que ela está vivendo? O que esta imagem precisa transmitir? Qual sentimento ela deve provocar? Que lembrança precisa preservar?</p>`,

diferenca: `
<p>Existem muitas formas de fotografar. A nossa tem três características que você vai perceber logo no primeiro contato.</p>
<div class="card"><h4>Ninguém é atendido em série</h4><p>Não temos pacote pronto esperando cliente. A proposta nasce da sua história, e por isso ela só existe depois da nossa conversa.</p></div>
<div class="card"><h4>Você sabe sempre onde está</h4><p>Do primeiro contato à entrega, cada etapa é explicada antes de acontecer. Ninguém fica no escuro esperando notícia.</p></div>
<div class="card"><h4>A experiência é parte do produto</h4><p>O cuidado no atendimento, no estúdio, na condução e na entrega não é cortesia: é o que estamos vendendo, junto com as imagens.</p></div>
<div class="selo"><div class="t">O seu negativo digital</div><p>Antigamente, quem tinha o negativo tinha a fotografia. Hoje o arquivo em alta resolução cumpre esse papel: com ele você pode imprimir, ampliar, emoldurar e exibir — e guardar para a vida toda, dentro dos termos da licença de uso.</p></div>`,

reuniao: `
<p>Antes de qualquer valor, existe uma conversa. Ela acontece no estúdio, dura cerca de uma hora e é onde a sua experiência começa de verdade.</p>

<h3>O que a gente trata nessa conversa</h3>
<ul class="lista-sim">
  <li>A sua história e o que motivou este momento</li>
  <li>O que você espera sentir ao ver as imagens prontas</li>

  <li>Todos os detalhes práticos do dia</li>

  <li>A reserva da data</li>
</ul>

</ul>

faq: [

/* ══════════════════════════════════════════════════════════════
   3. CAMADA DE CATEGORIA — escrita uma vez por categoria
   ══════════════════════════════════════════════════════════════ */

ensaio:{
  rotulo:'Ensaio',
  comoFunciona:`

   5. MONTAGEM — daqui para baixo você não precisa mexer
   ══════════════════════════════════════════════════════════════ */
function slugDoLink(){
  const q = new URLSearchParams(location.search).get('n');
  if(q) return q.toLowerCase();
  if(location.hash) return location.hash.slice(1).toLowerCase();
  const p = location.pathname.split('/').filter(Boolean).pop() || '';
  return p.replace(/\.html?$/,'').toLowerCase();
}

function galeria(slug,de,ate,layout){
  const cls = layout === 'solo' ? 'gal solo' : 'gal duo';
  const ids = [];
  for(let i=de;i<=ate;i++) ids.push(String(i).padStart(2,'0'));
  return `<div class="${cls}">${ids.map(i=>
    `<figure><img src="${CONFIG.PASTA_FOTOS}/${slug}/${i}.${CONFIG.EXT}" alt=""
      onerror="this.parentNode.remove()"></figure>`).join('')}</div>`;
}

function faqHTML(lista){
  return lista.map(([q,a])=>
    `<details><summary>${q}</summary><div class="a">${a}</div></details>`).join('');
}

  const evt = Object.keys(NICHOS).filter(s=>NICHOS[s].cat==='evento').map(botao).join('');
  document.getElementById('doc').innerHTML = `
   <section id="seletor"><div class="wrap">

  <section><div class="wrap">

function ativaFecho(){
  const cks = [...document.querySelectorAll('.ck')];
  const bC = document.getElementById('btn-cadastro');
  const bA = document.getElementById('btn-agenda');

  const revisa = () => {
    const ok = cks.every(c=>c.checked);
    bC.setAttribute('aria-disabled', !ok);
    bA.setAttribute('aria-disabled', !ok);
  };

  cks.forEach(c=>c.addEventListener('change',revisa));
  revisa();
}

/* ---------- sumário flutuante ---------- */
function montaSumario(){
  const secs = [...document.querySelectorAll('#doc section')];
  const box  = document.getElementById('sum-itens');
  const fab  = document.getElementById('fab');
  const pane = document.getElementById('sumario');
  const veu  = document.getElementById('veu');

  const itens = secs.map((s,i)=>{
    if(!s.id) s.id = 'sec' + i;
    const ey = s.querySelector('.eyebrow');
    return { id:s.id, lab: ey ? ey.textContent.trim() : 'Início' };
  });

  box.innerHTML = itens.map((it,i)=>
    `<a href="#${it.id}" data-alvo="${it.id}"><span class="num">${String(i+1).padStart(2,'0')}</span><span>${it.lab}</span></a>`
  ).join('') + `<div class="fim"><a href="#top-topo">Voltar ao início</a><br><a href="#" id="trocar-nicho" style="margin-top:8px;display:inline-block">Trocar de nicho</a></div>`;

  const abre = v => {
    pane.classList.toggle('on', v);
    veu.classList.toggle('on', v);
    fab.setAttribute('aria-expanded', v);
    document.body.style.overflow = v ? 'hidden' : '';
  };

  fab.addEventListener('click', ()=>abre(!pane.classList.contains('on')));
  veu.addEventListener('click', ()=>abre(false));
  box.addEventListener('click', e=>{
    const a = e.target.closest('a'); if(!a) return;
    abre(false);
    if(a.id === 'trocar-nicho'){ e.preventDefault(); seletor(); scrollTo(0,0); }
  });
  addEventListener('keydown', e=>{ if(e.key==='Escape') abre(false); });

  const links = [...box.querySelectorAll('a[data-alvo]')];
  const obs = new IntersectionObserver(entradas=>{
    entradas.forEach(en=>{
      if(!en.isIntersecting) return;
      links.forEach(l=>l.classList.toggle('ativo', l.dataset.alvo === en.target.id));
    });
  },{rootMargin:'-45% 0px -50% 0px'});
  secs.forEach(s=>obs.observe(s));
}

function progresso(){
  const h = document.body.scrollHeight - innerHeight;
  const p = h > 0 ? Math.min(100,(scrollY/h)*100) : 0;
  document.getElementById('prog').style.width = p + '%';
}

const slug = slugDoLink();
if(NICHOS[slug]) monta(slug); else seletor();
addEventListener('scroll',progresso,{passive:true});
progresso();
</script>
